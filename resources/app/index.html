<script>
const uiLocale=()=>state?.settings?.language==='en'?'en-US':state?.settings?.language==='ar'?'ar-SA':'fa-IR';const money=n=>window.TameshkCurrency?window.TameshkCurrency.format(n):new Intl.NumberFormat(uiLocale()).format(Math.round(Number(n)||0));const moneyRound=(n,record)=>window.TameshkCurrency?window.TameshkCurrency.round(n,record):Math.round(n);const qtyFmt=n=>new Intl.NumberFormat(uiLocale(),{maximumFractionDigits:6}).format(Number(n)||0);window.money=money;window.qtyFmt=qtyFmt;
const todayISO=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const recordDateLabel=(d,c)=>window.TameshkCalendar?.label(d,c||state?.settings?.transactionCalendar||'شمسی')||faDate(d);function customerName(t){return [t?.customerFirstName||t?.customer||'',t?.customerLastName||''].map(x=>String(x||'').trim()).filter(Boolean).join(' ')}
const jalaliDate=d=>{try{const lang=state?.settings?.language||'fa',locale=lang==='en'?'en-GB-u-ca-persian':lang==='ar'?'ar-SA-u-ca-persian':'fa-IR-u-ca-persian';return new Intl.DateTimeFormat(locale,{year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date((d||todayISO())+'T12:00:00'))}catch{return d||''}};const faDate=d=>{const lang=state?.settings?.language||'fa',date=new Date((d||todayISO())+'T12:00:00'),locale=lang==='en'?'en-GB-u-ca-gregory':lang==='ar'?'ar-SA-u-ca-gregory':'fa-IR-u-ca-gregory',greg=new Intl.DateTimeFormat(locale,{year:'numeric',month:'2-digit',day:'2-digit'}).format(date),mode=state?.settings?.dateMode||'شمسی',persian=jalaliDate(d);return mode==='میلادی'?greg:mode==='قمری'?(window.TameshkCalendar?.label(d,'قمری')||persian):mode==='هر دو'?`${persian} / ${greg}`:persian};
const fmtDate=d=>`${faDate(d)} · ${new Intl.DateTimeFormat(uiLocale(),{hour:'2-digit',minute:'2-digit'}).format(new Date())}`;const fmtTimestamp=x=>{const d=new Date(x||'');return Number.isNaN(+d)?esc(x||'—'):`${faDate(d.toISOString().slice(0,10))} · ${new Intl.DateTimeFormat(uiLocale(),{hour:'2-digit',minute:'2-digit',second:'2-digit'}).format(d)}`};
const IMAGE_LIMIT=500*1024,IMAGE_TYPES={ 'image/png':'png','image/jpeg':'jpeg','image/webp':'webp' };

const defaultState={categories:[],products:[],services:[],quickCatalog:[],transactions:[],expenses:[],transactionReturns:[],expenseReturns:[],consolidatedInvoices:[],settings:{business:'',taxDefault:false,taxPercent:10,invoiceNote:'',language:'en',currency:'USD',currencyDecimals:2,currencyDefaultsPending:true,dateMode:'میلادی',transactionCalendar:'میلادی',reportCalendar:'میلادی',zoom:1,invoiceTemplate:'کلاسیک',categorySelectionOptional:true,deletedCategories:[]}};
function loadSavedState(){try{const key='tameshk-state';let raw=localStorage.getItem(key);if(!raw){const legacyKey='tama'+'shk-state',legacy=localStorage.getItem(legacyKey);if(legacy){const parsed=JSON.parse(legacy);if(parsed&&typeof parsed==='object'&&!Array.isArray(parsed)){localStorage.setItem(key,legacy);localStorage.removeItem(legacyKey);raw=legacy}}}const parsed=raw?JSON.parse(raw):null;return parsed&&typeof parsed==='object'&&!Array.isArray(parsed)?parsed:structuredClone(defaultState)}catch{return structuredClone(defaultState)}}
function migrateLegacyBusinessCategory(data){
  const legacy='خدمات کافی‌نت',generic='خدمات عمومی';let changed=false;
  if(Array.isArray(data?.categories)&&data.categories.includes(legacy)){
    data.categories=[...new Set(data.categories.map(c=>c===legacy?generic:c))];changed=true;
  }
  const visited=new Set();
  function visit(value){
    if(!value||typeof value!=='object'||visited.has(value))return;visited.add(value);
    if(Array.isArray(value)){value.forEach(visit);return}
    for(const [key,child] of Object.entries(value)){
      if(key==='category'&&child===legacy){value[key]=generic;changed=true}
      else visit(child);
    }
  }
  visit(data);return changed;
}

function productsTable(rows=state.products){if(!rows.length)return '<div class="empty">کالایی ثبت نشده است.</div>';return `<div class="table-wrap" data-tp-key="products-inventory" data-tp-size="15" data-tp-no-search><table><thead><tr><th>نام کالا</th><th>دسته</th><th>واحد پایه و بسته‌ها</th><th>موجودی پایه</th><th>بهای خرید واحد پایه</th><th>قیمت فروش واحد پایه</th><th>آخرین تغییر قیمت</th><th>عملیات</th></tr></thead><tbody>${productRows(rows)}</tbody></table></div>`}
function filterProducts(q){const needle=String(q||'').toLocaleLowerCase();const filtered=state.products.filter(p=>(p.name+p.category).toLocaleLowerCase().includes(needle));document.getElementById('productsTable').innerHTML=productsTable(filtered)}function priceIntervals(p){const hist=(p.history||[]).slice().sort((a,b)=>new Date(a.timestamp||a.date)-new Date(b.timestamp||b.date)),ui=s=>window.uiText?window.uiText(s):s,intervals=!hist.length?[{index:0,price:Number(p.price)||0,start:null,end:null,label:ui('قیمت فعلی؛ تاریخچه‌ای ثبت نشده')}]:[{index:0,price:Number(hist[0].old)||0,start:null,end:hist[0].timestamp||hist[0].date,label:`${ui('پیش از')} ${fmtTimestamp(hist[0].timestamp||hist[0].date)}`}];hist.forEach((h,i)=>{const start=h.timestamp||h.date,end=hist[i+1]?.timestamp||hist[i+1]?.date||null;intervals.push({index:intervals.length,price:Number(h.new)||0,start,end,label:`${fmtTimestamp(start)} تا ${end?fmtTimestamp(end):'اکنون'}`})});const known=new Set(intervals.map(x=>x.price)),overrides=new Set();for(const t of state.transactions||[])for(const line of t.items||[])if(line.productId===p.id&&line.priceAtSale!==undefined&&Number.isFinite(Number(line.priceAtSale))&&!known.has(Number(line.priceAtSale)))overrides.add(Number(line.priceAtSale));overrides.forEach(price=>intervals.push({index:intervals.length,price,start:null,end:null,manualOverride:true,label:`${ui('قیمت دستی ثبت‌شده در فاکتور')}: ${money(price)}`}));return intervals}
function priceIntervalSalesByInterval(p){const intervals=priceIntervals(p),totals=intervals.map(()=>0);for(const t of state.transactions||[]){const stamp=t.createdAt||`${t.date||''}T00:00:00`;for(const line of t.items||[]){if(line.productId!==p.id)continue;const qty=Number(line.baseQty??line.qty)||0;if(!qty)continue;const at=Date.parse(stamp),snapshot=Number(line.priceAtSale??line.price),hasSnapshot=line.priceAtSale!==undefined&&Number.isFinite(snapshot);let eligible=hasSnapshot?intervals.filter(x=>x.price===snapshot):[];if(!eligible.length)eligible=intervals;let chosen=eligible.find(x=>(!x.start||!Number.isFinite(at)||at>=Date.parse(x.start))&&(!x.end||!Number.isFinite(at)||at<Date.parse(x.end)));if(!chosen){if(Number.isFinite(at)){chosen=eligible.reduce((best,x)=>{const boundary=x.start?Date.parse(x.start):x.end?Date.parse(x.end):at,dist=Math.abs(at-boundary);return !best||dist<best.dist?{x,dist}:best},{})?.x}chosen ||= eligible[0]}if(chosen)totals[chosen.index]+=qty}}return totals}

function saveProduct(id){const name=document.getElementById('pName').value.trim(),baseUnit=document.getElementById('pUnit').value.trim()||'عدد',stock=Number(document.getElementById('pStock').value),p=state.products.find(x=>x.id===id),category=document.getElementById('pCat')?.value?.trim()||'';if(!name)return showToast('نام کالا را وارد کنید.');const categoryOptional=state.settings?.categorySelectionOptional!==false,categoryChanged=document.getElementById('pCat')?.dataset.userChanged==='1',preserveDeletedCategory=!!p&&!!category&&category===String(p.category||'')&&!state.categories.includes(category)&&!categoryChanged;if(category&&!state.categories.includes(category)&&!preserveDeletedCategory)return showToast(window.uiText?.('یک دسته‌بندی معتبر انتخاب کنید.')||'یک دسته‌بندی معتبر انتخاب کنید.');if(!categoryOptional&&(!category||(!state.categories.includes(category)&&!preserveDeletedCategory)))return showToast(window.uiText?.('برای ثبت کالا یک دسته‌بندی انتخاب کنید.')||'برای ثبت کالا یک دسته‌بندی انتخاب کنید.');if(!Number.isFinite(stock)||stock<0)return showToast('موجودی باید صفر یا بیشتر باشد.');const innerName=document.getElementById('pPack1').value.trim(),innerQty=Number(document.getElementById('pPack1Qty').value),outerName=document.getElementById('pPack2').value.trim(),outerQty=Number(document.getElementById('pPack2Qty').value);if(innerName&&(!Number.isFinite(innerQty)||innerQty<=1))return showToast('ضریب بستهٔ میانی باید بیشتر از ۱ باشد.');if(outerName&&(!innerName||!Number.isFinite(outerQty)||outerQty<=1))return showToast('برای بستهٔ بیرونی، بستهٔ میانی و تعداد آن را وارد کنید.');if(innerName&&outerName&&innerName.toLocaleLowerCase()===outerName.toLocaleLowerCase())return showToast('نام بسته‌ها باید متفاوت باشد.');if([innerName,outerName].filter(Boolean).some(x=>x.toLocaleLowerCase()===baseUnit.toLocaleLowerCase()))return showToast('نام واحد پایه و بسته‌ها باید متفاوت باشد.');const packUnits=[];if(innerName)packUnits.push({name:innerName,baseQty:innerQty});if(ou // Negative expenses are valid only as exact, uniquely linked expense-return
// adjustments. Validation does not round, convert, or repair imported amounts.
function validateExpenseReturnAdjustments(data){
 const accepted=new Set(),expenses=data.expenses,returns=data.expenseReturns;
 const fail=()=>{throw new Error('Invalid linked expense-return adjustment.')};
 const nonempty=x=>typeof x==='string'&&!!x.trim();
 const validDate=x=>typeof x==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(x)&&Number.isFinite(Date.parse(x+'T12:00:00Z'))&&new Date(x+'T12:00:00Z').toISOString().slice(0,10)===x;
 const cfg=r=>({currency:r.currency??data.settings.currency??'IRT',currencyDecimals:r.currencyDecimals??data.settings.currencyDecimals??0});
 const same=(a,b)=>{const x=cfg(a),y=cfg(b);return x.currency===y.currency&&x.currencyDecimals===y.currencyDecimals};
 for(const adjustment of expenses){
  if(!adjustment||typeof adjustment!=='object')continue;
  if(!(adjustment.amount<0)&&!Object.hasOwn(adjustment,'returnRecordId'))continue;
  if(!Array.isArray(returns)||!nonempty(adjustment.id)||!nonempty(adjustment.returnRecordId)||adjustment.category!=='مرجوعی هزینه'||typeof adjustment.amount!=='number'||!Number.isFinite(adjustment.amount)||adjustment.amount>=0)fail();
  const matches=returns.filter(r=>r&&r.id===adjustment.returnRecordId);
  if(matches.length!==1)fail();const returned=matches[0];
  if(!nonempty(returned.id)||!nonempty(returned.expenseId)||typeof returned.amount!=='number'||!Number.isFinite(returned.amount)||returned.amount<=0||!validDate(returned.returnDate)||adjustment.amount!==-returned.amount||adjustment.date!==returned.returnDate)fail();
  const sources=expenses.filter(e=>e&&e.id===returned.expenseId);
  if(sources.length!==1)fail();const original=sources[0];
  if(original===adjustment||typeof original.amount!=='number'||!Number.isFinite(original.amount)||original.amount<=0||Object.hasOwn(original,'returnRecordId')||['مرجوعی هزینه','مرجوعی فروش'].includes(original.category)||!same(original,returned)||!same(original,adjustment))fail();
  if(expenses.filter(e=>e&&e.id===adjustment.id).length!==1||expenses.filter(e=>e&&e.returnRecordId===returned.id).length!==1)fail();
  const related=returns.filter(r=>r&&r.expenseId===original.id);let refunded=0;
  for(const r of related){if(!nonempty(r.id)||returns.filter(x=>x&&x.id===r.id).length!==1||typeof r.amount!=='number'||!Number.isFinite(r.amount)||r.amount<=0||!validDate(r.returnDate)||!same(original,r))fail();refunded+=r.amount}
  if(!Number.isFinite(refunded)||refunded>original.amount+1e-8)fail();
  accepted.add(adjustment.id);
 }

function removeInvoiceImage(slot){if(!['logo','stamp','signature'].includes(slot))return;state.settings.invoiceImages=state.settings.invoiceImages||{};delete state.settings.invoiceImages[slot];save();refreshInvoiceImageSlot(slot);showToast('تصویر حذف شد.')}
function transactionNote(t){return Object.prototype.hasOwnProperty.call(t,'note')?(t.note||''):(state.settings.invoiceNote||'')}
function restoreFile(e){const input=e?.target,f=input?.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const parsed=JSON.parse(String(r.result||''));installBackupPayload(parsed);showToast('اطلاعات بازیابی شد.')}catch(err){const tr=s=>typeof window.uiText==='function'?window.uiText(s):s;showToast(`${tr('فایل پشتیبان معتبر نیست.')}: ${err?.message||''}`)}finally{if(input)input.value=''}};r.onerror=()=>{showToast(typeof window.uiText==='function'?window.uiText('خواندن فایل پشتیبان ممکن نشد.'): 'خواندن فایل پشتیبان ممکن نشد.');if(input)input.value=''};r.readAsText(f)}
